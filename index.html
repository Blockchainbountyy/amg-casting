<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazing Grace Media - Casting Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
    .step { display: none; animation: fadeIn 0.4s ease-in-out; }
    .step.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .btn-animate { transition: all 0.2s ease-in-out; }
    .btn-animate:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    .btn-animate:active { transform: scale(0.95); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-center">

  <div class="max-w-2xl w-full bg-[#171717] rounded-2xl shadow-2xl overflow-hidden border border-gray-800">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-purple-900 to-indigo-900 p-6 relative flex items-center justify-center flex-col text-center">
      <!-- Logo -->
      <div class="absolute left-6 w-16 h-16 bg-black rounded-full border-2 border-gray-400 overflow-hidden flex items-center justify-center shadow-lg">
        <img src="https://i.postimg.cc/RJ3QWPj1/Amazing-Grace-Media-Editors-20261110-032159.jpg" alt="Logo" class="w-full h-full object-cover">
      </div>
      
      <!-- Titles -->
      <h1 class="text-3xl text-white font-extrabold tracking-tight mt-2 md:mt-0">AMAZING GRACE MEDIA</h1>
      <p class="text-sm text-white mt-1 opacity-90 font-medium">Thespians form for AMG Short film 📽️</p>
    </div>

    <!-- Form Container -->
    <div class="p-6 md:p-8">
      <p class="text-gray-400 text-sm text-center mb-6">Step into the story. Please fill out your details below. Don't worry about being too formal, just be yourself!</p>

      <form id="casting-form" action="https://formspree.io/f/mjyynobz" method="POST">
        
        <!-- Step 1: Contact -->
        <div class="step active" id="step-1">
          <h2 class="text-xl font-semibold mb-4 text-purple-400 border-b border-gray-700 pb-2">1. Personal Information</h2>
          <div class="space-y-4">
            <div><label class="block text-sm mb-1">Full Name</label><input type="text" name="Full Name" required class="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none"></div>
            <div><label class="block text-sm mb-1">Stage Name (Optional)</label><input type="text" name="Stage Name" class="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none"></div>
            <div><label class="block text-sm mb-1">Email Address</label><input type="email" name="Email" required class="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none"></div>
            <div><label class="block text-sm mb-1">Phone / WhatsApp</label><input type="tel" name="Phone" required class="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none"></div>
            <div><label class="block text-sm mb-1">Location & State of Origin</label><input type="text" name="Location" required class="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none"></div>
          </div>
          <div class="mt-6 flex justify-end">
            <button type="button" onclick="nextStep(2)" class="btn-animate bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold flex items-center">Next →</button>
          </div>
        </div>

        <!-- Step 2: Physical Attributes -->
        <div class="step" id="step-2">
          <h2 class="text-xl font-semibold mb-4 text-purple-400 border-b border-gray-700 pb-2">2. Physical Attributes</h2>
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm mb-1">Gender</label><select name="Gender" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"><option>Male</option><option>Female</option></select></div>
              <div><label class="block text-sm mb-1">Age Range</label><input type="text" name="Age Range" placeholder="e.g. 20-25" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm mb-1">Height</label><input type="text" name="Height" placeholder="e.g. 5'9" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></div>
              <div><label class="block text-sm mb-1">Body Build</label><input type="text" name="Build" placeholder="e.g. Athletic" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></div>
            </div>
            <div><label class="block text-sm mb-1">Distinctive Features (Tattoos, scars, etc.)</label><textarea name="Features" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></textarea></div>
          </div>
          <div class="mt-6 flex justify-between">
            <button type="button" onclick="prevStep(1)" class="btn-animate bg-gray-700 text-white px-6 py-2 rounded-lg font-semibold">← Back</button>
            <button type="button" onclick="nextStep(3)" class="btn-animate bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold">Next →</button>
          </div>
        </div>

        <!-- Step 3: Experience -->
        <div class="step" id="step-3">
          <h2 class="text-xl font-semibold mb-4 text-purple-400 border-b border-gray-700 pb-2">3. Experience</h2>
          <div class="space-y-4">
            <div><label class="block text-sm mb-1">Years of Acting Experience</label><select name="Experience" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"><option>Beginner</option><option>1-3 Years</option><option>4-7 Years</option><option>8+ Years</option></select></div>
            <div><label class="block text-sm mb-1">Notable Past Credits</label><textarea name="Credits" rows="2" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></textarea></div>
            <div><label class="block text-sm mb-1">Special Skills (Stunts, Dialects, Combat, etc.)</label><textarea name="Skills" rows="2" class="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none"></textarea></div>
          </div>
          <div class="mt-6 flex justify-between">
            <button type="button" onclick="prevStep(2)" class="btn-animate bg-gray-700 text-white px-6 py-2 rounded-lg font-semibold">← Back</button>
            <button type="button" onclick="nextStep(4)" class="btn-animate bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold">Next →</button>
          </div>
        </div>

        <!-- Step 4: Availability & Submit -->
        <div class="step" id="step-4">
          <h2 class="text-xl font-semibold mb-4 text-purple-400 border-b border-gray-700 pb-2">4. Availability</h2>
          <div class="space-y-4">
            <label class="flex items-start space-x-3 p-3 bg-black border border-gray-700 rounded-lg cursor-pointer">
              <input type="checkbox" name="Callback_Availability" value="Yes" required class="mt-1 w-4 h-4 text-purple-600">
              <span class="text-sm">I am available for call backs and overnight rehearsals.</span>
            </label>
            <label class="flex items-start space-x-3 p-3 bg-black border border-gray-700 rounded-lg cursor-pointer">
              <input type="checkbox" name="Consent" value="Yes" required class="mt-1 w-4 h-4 text-purple-600">
              <span class="text-sm text-gray-400">By checking this, I confirm my details are accurate and grant Amazing Grace Media permission to use my application for casting.</span>
            </label>
          </div>
          <div class="mt-8 flex justify-between">
            <button type="button" onclick="prevStep(3)" class="btn-animate bg-gray-700 text-white px-6 py-2 rounded-lg font-semibold">← Back</button>
            <button type="submit" class="btn-animate bg-green-600 hover:bg-green-500 text-white px-8 py-2 rounded-lg font-bold shadow-lg shadow-green-900/50">Submit Audition</button>
          </div>
        </div>

      </form>
    </div>
  </div>

  <script>
    function nextStep(step) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
    }
    function prevStep(step) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
    }
    
    // Smooth Formspree Submission
    var form = document.getElementById("casting-form");
    form.addEventListener("submit", function(ev) {
      ev.preventDefault();
      var data = new FormData(form);
      fetch(form.action, { method: form.method, body: data, headers: { 'Accept': 'application/json' } })
      .then(response => {
        if (response.ok) {
          form.innerHTML = "<div class='text-center py-10'><h3 class='text-2xl text-green-400 font-bold mb-2'>Submitted! 🎉</h3><p class='text-gray-400'>Amazing Grace Media has received your application. We will be in touch.</p></div>";
        }
      });
    });
  </script>
</body>
</html>
